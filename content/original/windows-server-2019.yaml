    {
      "id": "org.win.pwd.min_length",
      "revision": 1,
      "origin": "organizational",
      "title": "Ensure 'Minimum password length' is set to 14 or more characters",
      "severity": "high",
      "description": "Evaluates `windows.security_policy.password.min_length` on authorized Windows Server endpoints.",
      "rationale": "Independently authored organizational hardening baseline.",
      "applicability": {
        "op": "eq",
        "fact": "platform.family",
        "value": "windows_server"
      },
      "required_facts": [
        "windows.security_policy.password.min_length",
        "platform.family"
      ],
      "assertion": {
        "op": "gte",
        "fact": "windows.security_policy.password.min_length",
        "value": 14
      },
      "expected": {
        "fact": "windows.security_policy.password.min_length",
        "operator": "gte",
        "value": 14
      },
      "evidence": [
        "windows.security_policy.password.min_length",
        "platform.family"
      ],
      "remediation_template": "manual.win.01",
      "tests": [
        {
          "id": "conforming",
          "expect": "PASS",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "windows_server"
            },
            "windows.security_policy.password.min_length": {
              "state": "PRESENT",
              "value": 14
            }
          }
        },
        {
          "id": "deviation",
          "expect": "FAIL",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "windows_server"
            },
            "windows.security_policy.password.min_length": {
              "state": "PRESENT",
              "value": 8
            }
          }
        },
        {
          "id": "unavailable",
          "expect": "UNKNOWN",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "windows_server"
            },
            "windows.security_policy.password.min_length": {
              "state": "UNAVAILABLE"
            }
          }
        },
        {
          "id": "other-family",
          "expect": "NOT_APPLICABLE",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "other_os"
            },
            "windows.security_policy.password.min_length": {
              "state": "PRESENT",
              "value": 14
            }
          }
        }
      ]
    },
