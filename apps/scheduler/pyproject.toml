[project]
name = "baselineguard-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["baselineguard-persistence"]

[tool.uv.sources]
baselineguard-persistence = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baselineguard_scheduler"]

