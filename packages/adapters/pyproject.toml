[project]
name = "baselineguard-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["baselineguard-contracts", "paramiko>=3.5,<5"]

[tool.uv.sources]
baselineguard-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baselineguard_adapters"]
