[project]
name = "baselineguard-rule-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["baselineguard-contracts", "baselineguard-domain", "PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[tool.uv.sources]
baselineguard-contracts = { workspace = true }
baselineguard-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baselineguard_rule_engine"]

