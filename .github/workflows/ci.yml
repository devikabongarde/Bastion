name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-superuser-password
          POSTGRES_DB: baselineguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baselineguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install uv
        run: python -m pip install uv
      - name: Install pnpm
        run: corepack enable pnpm
      - name: Install locked dependencies
        run: |
          uv sync --locked --all-packages --group dev
          pnpm install --frozen-lockfile
      - name: Provision separate migration and runtime roles
        env:
          PGPASSWORD: ci-only-superuser-password
        run: |
          psql --host=localhost --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bg_migration LOGIN NOBYPASSRLS PASSWORD 'ci-only-migration-password';
          CREATE ROLE bg_api LOGIN NOBYPASSRLS PASSWORD 'ci-only-runtime-password';
          ALTER DATABASE baselineguard OWNER TO bg_migration;
          GRANT CONNECT ON DATABASE baselineguard TO bg_api;
          ALTER DEFAULT PRIVILEGES FOR ROLE bg_migration IN SCHEMA public GRANT SELECT ON TABLES TO bg_api;
          SQL
      - name: Lint and type check
        run: |
          uv run --locked ruff check apps packages tests migrations
          uv run --locked pyright
          pnpm typecheck
      - name: Apply database schema for integration tests
        env:
          BG_MIGRATION_DATABASE_URL: postgresql+psycopg://bg_migration:ci-only-migration-password@localhost:5432/baselineguard
        run: uv run --locked alembic upgrade head
      - name: Test and build
        env:
          BG_DATABASE_URL: postgresql+psycopg://bg_api:ci-only-runtime-password@localhost:5432/baselineguard
          BG_MIGRATION_DATABASE_URL: postgresql+psycopg://bg_migration:ci-only-migration-password@localhost:5432/baselineguard
        run: |
          uv run --locked pytest
          pnpm test
          pnpm build
      - name: Migration upgrade and rollback rehearsal
        env:
          BG_MIGRATION_DATABASE_URL: postgresql+psycopg://bg_migration:ci-only-migration-password@localhost:5432/baselineguard
        run: |
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
      - name: Browser acceptance test
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
