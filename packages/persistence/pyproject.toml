[project]
name = "baselineguard-persistence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2.5,<4",
  "alembic>=1.14,<2",
  "baselineguard-domain",
]

[tool.uv.sources]
baselineguard-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baselineguard_persistence"]

