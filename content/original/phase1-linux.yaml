      "id": "org.linux.ubuntu22.auth_ssh_permit_root_login",
      "revision": 1,
      "origin": "organizational",
      "title": "Disable direct SSH login for the root account",
      "severity": "high",
      "description": "Evaluate the normalized fact `auth.ssh.permit_root_login` on a supported Ubuntu 22.04 host.",
      "rationale": "This independently authored starter control reduces avoidable configuration exposure; administrators must confirm applicability to their role and operating requirements.",
      "applicability": {
        "op": "eq",
        "fact": "platform.family",
        "value": "ubuntu"
      },
      "required_facts": [
        "auth.ssh.permit_root_login",
        "platform.family"
      ],
      "assertion": {
        "op": "eq",
        "fact": "auth.ssh.permit_root_login",
        "value": "no"
      },
      "expected": {
        "fact": "auth.ssh.permit_root_login",
        "operator": "eq",
        "value": "no"
      },
      "evidence": [
        "auth.ssh.permit_root_login",
        "platform.family"
      ],
      "remediation_template": "manual.linux.01",
      "tests": [
        {
          "id": "conforming",
          "expect": "PASS",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "ubuntu"
            },
            "auth.ssh.permit_root_login": {
              "state": "PRESENT",
              "value": "no"
            }
          }
        },
        {
          "id": "deviation",
          "expect": "FAIL",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "ubuntu"
            },
            "auth.ssh.permit_root_login": {
              "state": "PRESENT",
              "value": "unexpected_value"
            }
          }
        },
        {
          "id": "unavailable",
          "expect": "UNKNOWN",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "ubuntu"
            },
            "auth.ssh.permit_root_login": {
              "state": "UNAVAILABLE"
            }
          }
        },
        {
          "id": "other-family",
          "expect": "NOT_APPLICABLE",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "rhel"
