    {
      "id": "org.cisco.mgmt.no_telnet",
      "revision": 1,
      "origin": "organizational",
      "title": "Ensure VTY lines accept SSH only (Telnet disabled)",
      "severity": "critical",
      "description": "Evaluates `management.vty.telnet_permitted` on Cisco IOS XE routers and switches.",
      "rationale": "Telnet transmits credentials and configuration in cleartext.",
      "applicability": {
        "op": "eq",
        "fact": "platform.family",
        "value": "cisco_ios_xe"
      },
      "required_facts": [
        "management.vty.telnet_permitted",
        "platform.family"
      ],
      "assertion": {
        "op": "eq",
        "fact": "management.vty.telnet_permitted",
        "value": false
      },
      "expected": {
        "fact": "management.vty.telnet_permitted",
        "operator": "eq",
        "value": false
      },
      "evidence": [
        "management.vty.telnet_permitted",
        "platform.family"
      ],
      "remediation_template": "manual.cisco.01",
      "tests": [
        {
          "id": "conforming",
          "expect": "PASS",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "cisco_ios_xe"
            },
            "management.vty.telnet_permitted": {
              "state": "PRESENT",
              "value": false
            }
          }
        },
        {
          "id": "deviation",
          "expect": "FAIL",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "cisco_ios_xe"
            },
            "management.vty.telnet_permitted": {
              "state": "PRESENT",
              "value": true
            }
          }
        },
        {
          "id": "unavailable",
          "expect": "UNKNOWN",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "cisco_ios_xe"
            },
            "management.vty.telnet_permitted": {
              "state": "UNAVAILABLE"
            }
          }
        },
        {
          "id": "other-family",
          "expect": "NOT_APPLICABLE",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "other_os"
            },
            "management.vty.telnet_permitted": {
              "state": "PRESENT",
              "value": false
            }
          }
        }
      ]
