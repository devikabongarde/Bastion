    {
      "id": "org.forti.mgmt.no_cleartext_admin",
      "revision": 1,
      "origin": "organizational",
      "title": "Ensure HTTP and Telnet administrative access are disabled on all interfaces",
      "severity": "critical",
      "description": "Evaluates `fortigate.interface.cleartext_admin_access_count` on FortiGate firewalls.",
      "rationale": "HTTP/Telnet management exposes credentials in cleartext.",
      "applicability": {
        "op": "eq",
        "fact": "platform.family",
        "value": "fortigate"
      },
      "required_facts": [
        "fortigate.interface.cleartext_admin_access_count",
        "platform.family"
      ],
      "assertion": {
        "op": "eq",
        "fact": "fortigate.interface.cleartext_admin_access_count",
        "value": 0
      },
      "expected": {
        "fact": "fortigate.interface.cleartext_admin_access_count",
        "operator": "eq",
        "value": 0
      },
      "evidence": [
        "fortigate.interface.cleartext_admin_access_count",
        "platform.family"
      ],
      "remediation_template": "manual.forti.01",
      "tests": [
        {
          "id": "conforming",
          "expect": "PASS",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "fortigate"
            },
            "fortigate.interface.cleartext_admin_access_count": {
              "state": "PRESENT",
              "value": 0
            }
          }
        },
        {
          "id": "deviation",
          "expect": "FAIL",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "fortigate"
            },
            "fortigate.interface.cleartext_admin_access_count": {
              "state": "PRESENT",
              "value": 2
            }
          }
        },
        {
          "id": "unavailable",
          "expect": "UNKNOWN",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "fortigate"
            },
            "fortigate.interface.cleartext_admin_access_count": {
              "state": "UNAVAILABLE"
            }
          }
        },
        {
          "id": "other-family",
          "expect": "NOT_APPLICABLE",
          "facts": {
            "platform.family": {
              "state": "PRESENT",
              "value": "other_os"
            },
            "fortigate.interface.cleartext_admin_access_count": {
              "state": "PRESENT",
              "value": 0
            }
          }
        }
      ]
    },
